<script type="text/javascript">
    RED.nodes.registerType("tuner-genius-server", {
        category: "config",
        defaults: {
            host: { value: "localhost", required: true },
            port: { value: 9010, required: true, validate: RED.validators.number() },
            autoConnect: { value: true },
        },
        label: function () {
            return "tuner genius at " + this.host + ":" + this.port;
        },
    });
</script>

<script type="text/html" data-template-name="tuner-genius-server">
    <div class="form-row">
        <label for="node-config-input-host"><i class="fa fa-bookmark"></i> Host</label>
        <input type="text" id="node-config-input-host" />
    </div>
    <div class="form-row">
        <label for="node-config-input-port"><i class="fa fa-bookmark"></i> Port</label>
        <input type="text" id="node-config-input-port" />
    </div>
    <div class="form-row">
        <label for="node-config-input-autoConnect"><i class="fa fa-plug"></i> Auto connect</label>
        <input type="checkbox" id="node-config-input-autoConnect" style="width:auto" />
    </div>
</script>

<script type="text/markdown" data-help-name="tuner-genius-server">
Tuner Genius shared connection configuration (Genius V4 API).

### Configuration

: Host (string) : Tuner Genius host name or IP address.

: Port (integer) : Tuner Genius API port number.

: Auto connect (boolean) : Connect and reconnect automatically.
</script>
