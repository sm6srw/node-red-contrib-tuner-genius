<script type="text/javascript">
    RED.nodes.registerType("tuner-genius-status", {
        category: "Tuner Genius",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },
            server: { type: "tuner-genius-server", required: true },
            property: { value: "*" },
            onlyChange: { value: true },
            deadband: { value: 0, validate: function (v) { return v === "" || v === undefined || (!isNaN(v) && Number(v) >= 0); } },
            startDelay: { value: 1000, validate: function (v) { return v === "" || v === undefined || (!isNaN(v) && Number(v) >= 0); } },
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        label: function () {
            if (this.name) return this.name;
            return this.property && this.property !== "*" ? "tuner " + this.property : "tuner status";
        },
        oneditprepare: function () {
            const sync = () => {
                $("#node-input-deadband-row").toggle($("#node-input-property").val() !== "*");
            };
            $("#node-input-property").on("change", sync);
            sync();
        },
    });
</script>

<script type="text/markdown" data-help-name="tuner-genius-status">
Emits one Tuner Genius XL status property, or the whole status, when it changes.

Use one node per property you care about, for example `fwd`, `swr` or `state`.

### Input

Any message emits the last known value, even if unchanged, and refreshes the status from the device.

### Output

: payload (number | string | object) : The value of the selected property, or the whole status object when *(all)* is selected.
: topic (string) : The property name, or `status` when *(all)* is selected.
: previous (number | string) : The previously emitted value (single property only; undefined for the first message).

### Details

The device reports `state` (0 standby, 1 operate), `active` (selected channel), `tuning`, `bypass`, `ag`,
`fwd`/`peak`/`max` (dBm), `swr`, `relayC1`/`relayL`/`relayC2` (0-255) and, per channel A and B,
`ptt`, `band`, `mode` (0 RF sense, 1 FLEX, 2 CAT, 3 P2B, 4 BCD), `flex`, `freq`, `bypass`, `bypassRx` and `ant`.

With *Only emit when the value changes* on, the first value after (re)connecting is always emitted.
The *Start delay* holds back all output for that many milliseconds after the flow is deployed, then emits
the latest known status. This gives downstream nodes such as dashboard widgets time to initialize.
The *Deadband* suppresses numeric changes smaller than the given amount, relative to the last emitted value,
which is useful for noisy values such as `fwd` and `swr`.
</script>
