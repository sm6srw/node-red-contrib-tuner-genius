<script type="text/javascript">
    RED.nodes.registerType("tuner-genius-status", {
        category: "Tuner Genius",
        color: "#a6bbcf",
        defaults: {
            name: { value: "" },

<script type="text/markdown" data-help-name="tuner-genius-status">
Emits the Tuner Genius XL status whenever the device reports it.

### Input

Any message reads and emits the current status.

### Output

: payload (object) : Tuner state as reported by the device, the key=value pairs of the `status` command, e.g. `fwd`, `peak`, `swr`, `operate`, `bypass`, `bandA`, `antA`.
</script>
